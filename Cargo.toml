[package]
name = "cerium"
description = "A light ls alternative"
version = "0.4.1"
edition = "2024"
authors = ["Ritchie Mwewa <hi@rly0nheart.com>"]
repository = "https://codeberg.org/rly0nheart/cerium"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
phf = { version = "0.13", features = ["macros"] }
libc = "0.2"
libhuman = "0.2"
nu-ansi-term = "0.50"
toml = "1.0"

filemagic = { version = "0.13", optional = true }

[features]
magic = ["dep:filemagic"]

[dev-dependencies]
tempfile = "3.24"

[[bin]]
name = "ce"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
