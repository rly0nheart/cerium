# Catppuccin Mocha Theme for Cerium
# Soothing pastel theme for the high-spirited!
# https://github.com/catppuccin/catppuccin
#
# Usage: Copy this file to ~/.config/cerium.toml


user          = { r = 249, g = 226, b = 175 }  # yellow
group         = { r = 250, g = 179, b = 135 }  # peach
tree-edge     = { r = 108, g = 112, b = 134 }  # overlay0
header        = { r = 249, g = 226, b = 175 }  # yellow
path          = { r = 137, g = 180, b = 250 }  # lavender
numeric       = { r = 137, g = 220, b = 235 }  # sky
punctuation   = { r = 108, g = 112, b = 134 }  # overlay0
summary       = { r = 205, g = 214, b = 244 }  # text
checksum      = { r = 148, g = 226, b = 213 }  # teal
magic         = { r = 245, g = 194, b = 231 }  # pink
mountpoint    = { r = 203, g = 166, b = 247 }  # mauve

[size]
none          = { r = 166, g = 227, b = 161 }  # green
small         = { r = 166, g = 227, b = 161 }  # green
medium        = { r = 148, g = 226, b = 213 }  # teal
large         = { r = 249, g = 226, b = 175 }  # yellow

