write         = { r = 204, g = 36, b = 29 }  # red
exec          = { r = 152, g = 151, b = 26 }  # green
no-access     = { r = 146, g = 131, b = 116 }  # gray
exec-sticky   = { r = 177, g = 98, b = 134 }  # purple
filetype      = { r = 69, g = 133, b = 136 }  # blue
acl           = { r = 152, g = 151, b = 26 }  # green
context       = { r = 177, g = 98, b = 134 }  # purple
attribute     = { r = 104, g = 157, b = 106 }  # aqua

