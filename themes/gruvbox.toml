# Gruvbox Dark Theme for Cerium
# Authentic Gruvbox color palette by Pavel Pertsev (morhetz)
# https://github.com/morhetz/gruvbox
#
# Usage: Copy this file to ~/.config/cerium.toml


user          = { r = 250, g = 189, b = 47 }  # bright_yellow
group         = { r = 254, g = 128, b = 25 }  # bright_orange
tree-edge     = { r = 146, g = 131, b = 116 }  # gray
header        = { r = 250, g = 189, b = 47 }  # bright_yellow
path          = { r = 69, g = 133, b = 136 }  # blue
numeric       = { r = 131, g = 165, b = 152 }  # bright_blue
punctuation   = { r = 146, g = 131, b = 116 }  # gray
summary       = { r = 235, g = 219, b = 178 }  # fg (light1)
checksum      = { r = 142, g = 192, b = 124 }  # bright_aqua
magic         = { r = 211, g = 134, b = 155 }  # bright_purple
mountpoint    = { r = 177, g = 98, b = 134 }  # purple

[size]
none          = { r = 152, g = 151, b = 26 }  # green
small         = { r = 184, g = 187, b = 38 }  # bright_green
medium        = { r = 142, g = 192, b = 124 }  # bright_aqua
large         = { r = 250, g = 189, b = 47 }  # bright_yellow

[date]
