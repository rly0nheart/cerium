# Solarized Dark Theme for Cerium
# Solarized color palette by Ethan Schoonover
# https://ethanschoonover.com/solarized/
#
# Usage: Copy this file to ~/.config/cerium.toml


user          = { r = 181, g = 137, b = 0 }  # yellow
group         = { r = 203, g = 75, b = 22 }  # orange
tree-edge     = { r = 88, g = 110, b = 117 }  # base01
header        = { r = 181, g = 137, b = 0 }  # yellow
path          = { r = 38, g = 139, b = 210 }  # blue
numeric       = { r = 42, g = 161, b = 152 }  # cyan
punctuation   = { r = 88, g = 110, b = 117 }  # base01
summary       = { r = 131, g = 148, b = 150 }  # base0
