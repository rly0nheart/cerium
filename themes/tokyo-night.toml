# Tokyo Night Theme for Cerium
# A clean, dark theme that celebrates the lights of Downtown Tokyo
# https://github.com/enkia/tokyo-night-vscode-theme
#
# Usage: Copy this file to ~/.config/cerium.toml


user          = { r = 224, g = 175, b = 104 }  # yellow
group         = { r = 255, g = 158, b = 100 }  # orange
tree-edge     = { r = 86, g = 95, b = 137 }  # comment
header        = { r = 224, g = 175, b = 104 }  # yellow
path          = { r = 122, g = 162, b = 247 }  # blue
numeric       = { r = 125, g = 207, b = 255 }  # cyan
punctuation   = { r = 86, g = 95, b = 137 }  # comment
summary       = { r = 169, g = 177, b = 214 }  # fg
checksum      = { r = 125, g = 207, b = 255 }  # cyan
magic         = { r = 255, g = 158, b = 221 }  # magenta
mountpoint    = { r = 255, g = 158, b = 221 }  # magenta

[size]
none          = { r = 158, g = 206, b = 106 }  # green
small         = { r = 158, g = 206, b = 106 }  # green
medium        = { r = 125, g = 207, b = 255 }  # cyan
large         = { r = 224, g = 175, b = 104 }  # yellow

[date]
minute-old    = { r = 125, g = 207, b = 255 }  # cyan
hour-old      = { r = 122, g = 162, b = 247 }  # blue
day-old       = { r = 187, g = 154, b = 247 }  # purple
week-old      = { r = 187, g = 154, b = 247 }  # purple
month-old     = { r = 86, g = 95, b = 137 }  # comment
older         = { r = 65, g = 72, b = 104 }  # dark4

[permission]
read          = { r = 224, g = 175, b = 104 }  # yellow
write         = { r = 247, g = 118, b = 142 }  # red
exec          = { r = 158, g = 206, b = 106 }  # green
no-access     = { r = 86, g = 95, b = 137 }  # comment
exec-sticky   = { r = 255, g = 158, b = 221 }  # magenta
filetype      = { r = 122, g = 162, b = 247 }  # blue
acl           = { r = 158, g = 206, b = 106 }  # green
context       = { r = 255, g = 158, b = 221 }  # magenta
attribute     = { r = 125, g = 207, b = 255 }  # cyan

[filekind]
normal        = { r = 169, g = 177, b = 214 }  # fg
directory     = { r = 122, g = 162, b = 247 }  # blue
symlink       = { r = 125, g = 207, b = 255 }  # cyan

[file_type]
source        = { r = 224, g = 175, b = 104 }  # yellow
build         = { r = 125, g = 207, b = 255 }  # cyan
document      = { r = 169, g = 177, b = 214 }  # fg
crypto        = { r = 247, g = 118, b = 142 }  # red
image         = { r = 255, g = 158, b = 221 }  # magenta
video         = { r = 255, g = 158, b = 100 }  # orange
music         = { r = 158, g = 206, b = 106 }  # green
compressed    = { r = 224, g = 175, b = 104 }  # yellow
rust          = { r = 255, g = 158, b = 100 }  # orange
python        = { r = 122, g = 162, b = 247 }  # blue
javascript    = { r = 224, g = 175, b = 104 }  # yellow
c             = { r = 125, g = 207, b = 255 }  # cyan
go            = { r = 125, g = 207, b = 255 }  # cyan
java          = { r = 255, g = 158, b = 100 }  # orange
ruby          = { r = 247, g = 118, b = 142 }  # red
php           = { r = 187, g = 154, b = 247 }  # purple
lua           = { r = 122, g = 162, b = 247 }  # blue
html          = { r = 247, g = 118, b = 142 }  # red
css           = { r = 187, g = 154, b = 247 }  # purple
json          = { r = 255, g = 158, b = 221 }  # magenta
xml           = { r = 169, g = 177, b = 214 }  # fg
yaml          = { r = 125, g = 207, b = 255 }  # cyan
markdown      = { r = 169, g = 177, b = 214 }  # fg
pdf           = { r = 247, g = 118, b = 142 }  # red
text          = { r = 169, g = 177, b = 214 }  # fg

[cli_help]
header        = { r = 224, g = 175, b = 104 }  # yellow
usage         = { r = 158, g = 206, b = 106 }  # green
literal       = { r = 125, g = 207, b = 255 }  # cyan
placeholder   = { r = 255, g = 158, b = 100 }  # orange
