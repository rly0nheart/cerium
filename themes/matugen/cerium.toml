# Cerium theme template for matugen
# https://github.com/InioX/matugen
#
# This is a *matugen template*, not a ready-to-use config. matugen renders the
# `{{colors.*}}` placeholders into real hex values and writes the result to
# ~/.config/cerium.toml, so Cerium's colors follow your wallpaper.
#
# Setup:
#   1. cp themes/matugen/cerium.toml ~/.config/matugen/templates/cerium.toml
#   2. Add to ~/.config/matugen/config.toml:
#
#        [templates.cerium]
#        input_path  = '~/.config/matugen/templates/cerium.toml'
#        output_path = '~/.config/cerium.toml'
#
#   3. Regenerate: `matugen image /path/to/wallpaper.png`
#
# Every Cerium key is optional — anything you delete here falls back to the
# built-in Catppuccin Mocha color for that key. Edit the role mappings
# freely; they only reference the [palette] names below.

# The [palette] block at the bottom holds the Material You roles matugen
# resolves from the source image.

user          = "secondary"
group         = "tertiary"
tree-edge     = "outline"
header        = "primary"
path          = "primary"
numeric       = "secondary"
punctuation   = "outline"
summary       = "on_surface"
checksum      = "tertiary"
magic         = "primary"
mountpoint    = "primary"

[size]
none          = "on_surface_variant"
small         = "secondary"
medium        = "tertiary"
large         = "primary"

[date]
minute-old    = "primary"
hour-old      = "secondary"
day-old       = "tertiary"
week-old      = "on_surface_variant"
month-old     = "outline"
older         = "outline"

[permission]
read          = "secondary"
write         = "error"
exec          = "tertiary"
no-access     = "outline"
exec-sticky   = "primary"
filetype      = "primary"
acl           = "tertiary"
context       = "primary"
attribute     = "secondary"

[filekind]
normal        = "on_surface"
directory     = "primary"
symlink       = "tertiary"

[file_type]
source        = "tertiary"
build         = "secondary"
document      = "on_surface"
crypto        = "error"
image         = "tertiary"
video         = "primary"
music         = "secondary"
compressed    = "secondary"
rust          = "primary"
python        = "secondary"
javascript    = "tertiary"
c             = "secondary"
go            = "tertiary"
java          = "primary"
ruby          = "error"
php           = "primary"
lua           = "secondary"
html          = "primary"
css           = "secondary"
json          = "tertiary"
xml           = "on_surface"
yaml          = "secondary"
markdown      = "on_surface"
pdf           = "error"
text          = "on_surface"

[cli_help]
header        = "primary"
usage         = "tertiary"
literal       = "secondary"
placeholder   = "on_surface_variant"

[palette]
primary            = "{{colors.primary.default.hex}}"
on_primary         = "{{colors.on_primary.default.hex}}"
primary_container  = "{{colors.primary_container.default.hex}}"
secondary          = "{{colors.secondary.default.hex}}"
tertiary           = "{{colors.tertiary.default.hex}}"
error              = "{{colors.error.default.hex}}"
surface            = "{{colors.surface.default.hex}}"
on_surface         = "{{colors.on_surface.default.hex}}"
on_surface_variant = "{{colors.on_surface_variant.default.hex}}"
outline            = "{{colors.outline.default.hex}}"

