# Rosé Pine Theme for Cerium
# All natural pine, faux fur and a bit of soho vibes
# https://rosepinetheme.com
#
# Usage: Copy this file to ~/.config/cerium.toml


user          = { r = 246, g = 193, b = 119 }  # gold
group         = { r = 234, g = 154, b = 151 }  # rose
tree-edge     = { r = 110, g = 106, b = 134 }  # muted
header        = { r = 246, g = 193, b = 119 }  # gold
path          = { r = 49, g = 116, b = 143 }  # pine
numeric       = { r = 156, g = 207, b = 216 }  # foam
punctuation   = { r = 110, g = 106, b = 134 }  # muted
summary       = { r = 224, g = 222, b = 244 }  # text
