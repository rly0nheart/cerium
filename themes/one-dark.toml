# One Dark Theme for Cerium
# Atom's iconic One Dark theme
# https://github.com/atom/atom/tree/master/packages/one-dark-syntax
#
# Usage: Copy this file to ~/.config/cerium.toml


user          = { r = 229, g = 192, b = 123 }  # yellow
group         = { r = 209, g = 154, b = 102 }  # orange
tree-edge     = { r = 92, g = 99, b = 112 }  # comment
header        = { r = 229, g = 192, b = 123 }  # yellow
path          = { r = 97, g = 175, b = 239 }  # blue
numeric       = { r = 86, g = 182, b = 194 }  # cyan
punctuation   = { r = 92, g = 99, b = 112 }  # comment
summary       = { r = 171, g = 178, b = 191 }  # fg
checksum      = { r = 86, g = 182, b = 194 }  # cyan
magic         = { r = 198, g = 120, b = 221 }  # purple
mountpoint    = { r = 198, g = 120, b = 221 }  # purple

[size]
none          = { r = 152, g = 195, b = 121 }  # green
small         = { r = 152, g = 195, b = 121 }  # green
medium        = { r = 86, g = 182, b = 194 }  # cyan
large         = { r = 229, g = 192, b = 123 }  # yellow

[date]
minute-old    = { r = 86, g = 182, b = 194 }  # cyan
hour-old      = { r = 97, g = 175, b = 239 }  # blue
day-old       = { r = 198, g = 120, b = 221 }  # purple
week-old      = { r = 198, g = 120, b = 221 }  # purple
month-old     = { r = 92, g = 99, b = 112 }  # comment
older         = { r = 76, g = 82, b = 99 }  # gutter

[permission]
read          = { r = 229, g = 192, b = 123 }  # yellow
write         = { r = 224, g = 108, b = 117 }  # red
exec          = { r = 152, g = 195, b = 121 }  # green
no-access     = { r = 92, g = 99, b = 112 }  # comment
exec-sticky   = { r = 198, g = 120, b = 221 }  # purple
filetype      = { r = 97, g = 175, b = 239 }  # blue
acl           = { r = 152, g = 195, b = 121 }  # green
context       = { r = 198, g = 120, b = 221 }  # purple
attribute     = { r = 86, g = 182, b = 194 }  # cyan

[filekind]
normal        = { r = 171, g = 178, b = 191 }  # fg
directory     = { r = 97, g = 175, b = 239 }  # blue
symlink       = { r = 86, g = 182, b = 194 }  # cyan

[file_type]
source        = { r = 229, g = 192, b = 123 }  # yellow
build         = { r = 86, g = 182, b = 194 }  # cyan
document      = { r = 171, g = 178, b = 191 }  # fg
crypto        = { r = 224, g = 108, b = 117 }  # red
image         = { r = 198, g = 120, b = 221 }  # purple
video         = { r = 209, g = 154, b = 102 }  # orange
music         = { r = 152, g = 195, b = 121 }  # green
compressed    = { r = 229, g = 192, b = 123 }  # yellow
rust          = { r = 209, g = 154, b = 102 }  # orange
python        = { r = 97, g = 175, b = 239 }  # blue
javascript    = { r = 229, g = 192, b = 123 }  # yellow
c             = { r = 86, g = 182, b = 194 }  # cyan
go            = { r = 86, g = 182, b = 194 }  # cyan
java          = { r = 209, g = 154, b = 102 }  # orange
ruby          = { r = 224, g = 108, b = 117 }  # red
php           = { r = 198, g = 120, b = 221 }  # purple
lua           = { r = 97, g = 175, b = 239 }  # blue
html          = { r = 224, g = 108, b = 117 }  # red
css           = { r = 198, g = 120, b = 221 }  # purple
json          = { r = 229, g = 192, b = 123 }  # yellow
xml           = { r = 171, g = 178, b = 191 }  # fg
yaml          = { r = 86, g = 182, b = 194 }  # cyan
markdown      = { r = 171, g = 178, b = 191 }  # fg
pdf           = { r = 224, g = 108, b = 117 }  # red
text          = { r = 171, g = 178, b = 191 }  # fg

[cli_help]
header        = { r = 229, g = 192, b = 123 }  # yellow
usage         = { r = 152, g = 195, b = 121 }  # green
literal       = { r = 86, g = 182, b = 194 }  # cyan
placeholder   = { r = 209, g = 154, b = 102 }  # orange
