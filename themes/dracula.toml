# Dracula Theme for Cerium
# Official Dracula color palette by Zeno Rocha
# https://draculatheme.com
#
# Usage: Copy this file to ~/.config/cerium.toml


user          = { r = 241, g = 250, b = 140 }  # yellow
group         = { r = 255, g = 184, b = 108 }  # orange
tree-edge     = { r = 98, g = 114, b = 164 }  # comment
header        = { r = 241, g = 250, b = 140 }  # yellow
path          = { r = 189, g = 147, b = 249 }  # purple
numeric       = { r = 139, g = 233, b = 253 }  # cyan
punctuation   = { r = 98, g = 114, b = 164 }  # comment
summary       = { r = 248, g = 248, b = 242 }  # foreground
